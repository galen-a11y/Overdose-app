# Cloudflare Worker that sends alert texts through Twilio and runs the
# heartbeat backup. See server/README.md for setup.
name = "spotter-server"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionObject"]

# Limits setup texts (test and welcome) per destination number, so the public
# endpoints can't be used to spam someone. Remove this block if your account
# doesn't have the rate limiting binding; the code skips it when absent.
[[ratelimits]]
name = "TEXT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
# Set to "true" to log texts instead of sending them (no Twilio needed).
DRY_RUN = "true"
# Secrets, set with `wrangler secret put <NAME>`:
#   APP_KEY                 shared key the app sends in X-App-Key
#   TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN
#   TWILIO_FROM             sending number in E.164, or
#   TWILIO_MESSAGING_SERVICE_SID
