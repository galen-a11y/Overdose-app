name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: SafetyCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: SafetyCore

  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ios:
    name: iOS app build and core tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build app for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Spotter.xcodeproj -scheme Spotter \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 200
      - name: SafetyCore tests on macOS
        run: swift test
        working-directory: SafetyCore
